<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đọc Hòm Thư</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-container">
    <header class="header">
      <div class="header-tabs">
        <div class="header-tab active">Đọc Hòm Thư</div>
        <div class="header-tab">Đọc Gmail</div>
        <div class="header-tab">Đọc Hotmail</div>
      </div>
      <div class="header-actions">
        <button class="action-button">Làm mới</button>
        <button class="action-button">Trợ giúp</button>
      </div>
    </header>
    
    <div class="sub-header">Đọc Gmail</div>
    
    <div class="main-content">
      <div class="email-list-container">
        <div class="email-input-container">
          <label class="email-input-label">Địa chỉ Gmail:</label>
          <input type="text" id="emailInput" placeholder="Nhập địa chỉ Gmail">
          <button onclick="readEmails()">Đọc Gmail</button>
        </div>
        <ul id="emailList" class="email-list"></ul>
      </div>
      
      <div class="email-content-container" id="emailContent">
        <div class="no-email-selected">
          Chọn một email để xem nội dung
        </div>
      </div>
    </div>
  </div>
  
  <script src="script.js"></script>
  <script src="email-viewer.js"></script>
</body>
</html>
