<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đọc Hòm Thư</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-container">
    <div class="top-bar">
      <div class="language-selector">
        <a href="#" class="language active">VI</a>
        <a href="#" class="language">EN</a>
      </div>
      <div class="login-button">
        <button>Đăng nhập</button>
      </div>
    </div>
    
    <div class="main-nav">
      <div class="nav-links">
        <a href="#gmail" class="nav-link active">Đọc Gmail</a>
        <a href="#hotmail" class="nav-link">Đọc Hotmail</a>
        <a href="#2fa" class="nav-link">2FA</a>
      </div>
    </div>
    
    <div class="main-content">
      <div class="email-list-container">
        <div class="email-input-container">
          <label class="email-input-label">Địa chỉ Gmail:</label>
          <input type="text" id="emailInput" placeholder="Nhập địa chỉ Gmail">
          <button onclick="readEmails()">Đọc Gmail</button>
        </div>
        <ul id="emailList" class="email-list"></ul>
      </div>
      
      <div class="email-content-container" id="emailContent">
        <div class="no-email-selected">
          Chọn một email để xem nội dung
        </div>
      </div>
    </div>
  </div>
  
  <script src="script.js"></script>
  <script src="email-viewer.js"></script>
</body>
</html>
